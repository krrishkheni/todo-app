<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>To-do app</title>
<meta name="description" content="A simple to-do app built with HTML, CSS and JavaScript. Tasks are saved in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1f; --surface:#111833; --border:#27326a; --text:#e9edfb; --muted:#a5afd0;
  --accent:#7c9cff; --on-accent:#0a0e1f; --danger:#ff8a8a;
  --head:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f8ff; --surface:#fff; --border:#d6def5; --text:#0f1630; --muted:#4a5578; --accent:#2f55e0; --on-accent:#fff; --danger:#c62828}
}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--body); font-size:1.0625rem; line-height:1.5; display:flex; justify-content:center; padding:2rem 1rem}
main{width:100%; max-width:34rem}
h1{font-family:var(--head); font-size:2rem; margin:0 0 .25rem}
.sub{color:var(--muted); margin:0 0 1.5rem}
form{display:flex; gap:.5rem; flex-wrap:wrap}
label{flex-basis:100%; font-weight:500}
input[type=text]{flex:1; min-width:0; min-height:48px; padding:.6rem .9rem; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit}
button{min-height:48px; padding:.6rem 1.1rem; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font:inherit; font-weight:700; cursor:pointer; transition:border-color .15s, background .15s}
button:hover{border-color:var(--accent)}
.add{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.filters{display:flex; gap:.4rem; margin:1.5rem 0 .75rem}
.filters button{min-height:44px; font-weight:500}
.filters button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
ul{list-style:none; margin:0; padding:0; display:grid; gap:.5rem}
li{display:flex; align-items:center; gap:.75rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.35rem .5rem .35rem .9rem}
li label{flex:1; display:flex; align-items:center; gap:.75rem; min-height:44px; cursor:pointer; font-weight:400; word-break:break-word}
li input[type=checkbox]{width:1.35rem; height:1.35rem; accent-color:var(--accent); flex:none}
li.done span{text-decoration:line-through; color:var(--muted)}
li .del{min-width:44px; min-height:44px; padding:0; color:var(--danger); font-size:1.4rem; line-height:1}
.empty{color:var(--muted); text-align:center; padding:1.5rem 0}
.foot{display:flex; justify-content:space-between; align-items:center; margin-top:1rem; color:var(--muted)}
.foot button{min-height:44px; font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<main>
  <h1>To-do list</h1>
  <p class="sub">Your tasks are saved in this browser.</p>

  <form id="form">
    <label for="task">New task</label>
    <input id="task" type="text" maxlength="120" autocomplete="off" placeholder="For example: finish the DSA assignment" required>
    <button class="add" type="submit">Add task</button>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="active" aria-pressed="false">Active</button>
    <button type="button" data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>
  <p id="empty" class="empty" hidden></p>

  <div class="foot">
    <span id="count" aria-live="polite"></span>
    <button type="button" id="clear">Clear completed</button>
  </div>
</main>

<script>
(function () {
  var KEY = "todo-app-tasks";
  var tasks = load();
  var filter = "all";
  var form = document.getElementById("form");
  var input = document.getElementById("task");
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function render() {
    list.innerHTML = "";
    var shown = tasks.filter(function (t) {
      return filter === "all" || (filter === "done" ? t.done : !t.done);
    });
    shown.forEach(function (t) {
      var li = document.createElement("li");
      if (t.done) li.className = "done";

      var label = document.createElement("label");
      var box = document.createElement("input");
      box.type = "checkbox";
      box.checked = t.done;
      box.addEventListener("change", function () { t.done = box.checked; save(); render(); });
      var text = document.createElement("span");
      text.textContent = t.text;
      label.appendChild(box);
      label.appendChild(text);

      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "\u00d7";
      del.setAttribute("aria-label", "Delete task: " + t.text);
      del.addEventListener("click", function () {
        tasks = tasks.filter(function (x) { return x.id !== t.id; });
        save(); render();
      });

      li.appendChild(label);
      li.appendChild(del);
      list.appendChild(li);
    });

    empty.hidden = shown.length > 0;
    if (!shown.length) {
      empty.textContent = tasks.length ? "No tasks in this view." : "No tasks yet. Add your first one above.";
    }
    var left = tasks.filter(function (t) { return !t.done; }).length;
    count.textContent = left + (left === 1 ? " task left" : " tasks left");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var value = input.value.trim();
    if (!value) return;
    tasks.push({ id: Date.now(), text: value, done: false });
    input.value = "";
    save(); render();
    input.focus();
  });

  document.querySelectorAll("[data-filter]").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-filter");
      document.querySelectorAll("[data-filter]").forEach(function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    });
  });

  document.getElementById("clear").addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
